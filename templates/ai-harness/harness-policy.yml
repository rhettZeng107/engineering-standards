version: 0.4
status: template
scope:
  provider_neutral: true
  project: "<project-name>"

truth_sources:
  priority:
    - "current_user_instruction"
    - "system_and_safety"
    - "nearest_project_instruction"
    - "global_instruction"
    - "adr_and_standards"
    - "memory_and_backlog"
    - "agent_report_after_verification"

tracks:
  simple:
    triggers:
      - "small_reversible_edit"
      - "no_contract"
      - "no_db_schema"
      - "no_auth_or_security"
      - "no_production"
    required_outputs:
      - "evidence_anchor"
      - "minimal_verification"
  standard:
    triggers:
      - "contract"
      - "db_schema"
      - "auth"
      - "multi_file"
      - "business_feature"
    required_outputs:
      - "plan"
      - "evidence"
      - "review"
      - "verification"
  migration:
    triggers:
      - "legacy_modernization"
      - "functional_equivalence"
    required_outputs:
      - "source_inventory"
      - "equivalence_review"
      - "migration_plan"
      - "verification"

preflight:
  required_for:
    - "standard"
    - "migration"
    - "cross_repo"
    - "db"
    - "auth"
    - "production"
    - "deployment"
    - "long_running"
  checks:
    - "pwd"
    - "git_root"
    - "repo_role"
    - "git_remote"
    - "git_branch"
    - "dirty_state"
    - "instruction_chain"
    - "verification_plan"
  completion_claims_require_independent_verification:
    - "commit"
    - "push"
    - "sync"
    - "deployment"
    - "ci"

project_map:
  retain_when_present: true
  default_path: ".planning/codebase"
  role: "navigation_and_mechanism_map_not_final_truth"
  staleness_reminder_days: 15
  read_for:
    - "standard"
    - "migration"
    - "spec_plan"
    - "major_research"
  stale_relevant_action: "scoped_refresh_or_record_stale_risk"
  refresh_scope: "affected_sections_only_no_full_rewrite"
  refresh_after:
    - "substantial_plan_done"
    - "migration_done"
    - "major_mechanism_change"
  refresh_requirements:
    - "preserve_unrelated_domains"
    - "update_MECHANISMS_when_mechanism_changes"
    - "stamp_per_repo_heads_for_multi_repo"

code_navigation:
  symbol_queries_default: "lsp"
  csharp_preferred_adapter: "lsp_nav_bridge"
  cross_repo_analysis_adapter: "bounded_child_execution"
  text_search_allowed_for:
    - "copy"
    - "route_strings"
    - "config"
    - "docs"
    - "sql"
    - "json"
    - "comments"
    - "file_discovery"
  fallback_when_lsp_unavailable: "text_search_with_limitations_and_followup_build_or_semantic_proof"
  compiler_correctness_gate: "build"

evidence:
  required_for_key_claims: true
  accepted_methods:
    - "file_line"
    - "api_response"
    - "db_query"
    - "git_result"
    - "build"
    - "test"
    - "browser"
    - "e2e"
    - "lsp"
    - "text_search"

gates:
  preflight:
    required_for: "preflight.required_for"
  pre_commit:
    code_review_required_for_code_changes: true
    review_candidate: "staged_diff"
    primary_reviewer_count: 1
    specialist_replaces_generic: true
    second_review_triggers:
      - "second_independent_high_risk_domain"
      - "critical_or_high_rework"
      - "scope_expansion"
      - "substantial_rework"
    ordinary_docs_review_required: false
    receipt_fields:
      - "repo"
      - "staged_diff_hash"
      - "reviewer"
      - "verdict"
    secret_scan_required: true
    verification_required: true
  migration:
    source_inventory_required: true
    equivalence_review_required: true
    deterministic_gate_before_llm: true
    default_critic_rounds: 1
    additional_critic_triggers:
      - "critic_found_gap"
      - "source_or_contract_changed"
      - "tier3_high_risk"
    vote_trigger: "non_deterministic_and_high_impact"
    minimum_distinct_vote_lenses: 2
    any_refutation_disputes: true
    final_batch_code_review_count: 1
    local_verify_before_commit: true
  multi_repo:
    verify_each_touched_repo: true
    root_workspace_and_nested_repo_must_not_be_mixed: true
  git:
    pull_rebase_before_push: true
    independent_status_after_push: true
  production:
    destructive_write_requires_human_approval: true
  recovery:
    progress_required_for_multi_turn: true

run_record:
  mandatory_for:
    - "migration"
    - "cross_repo"
    - "db"
    - "db_schema"
    - "auth"
    - "production"
    - "deployment"
    - "ci_self_heal"
    - "multi_agent"
    - "multi_turn"
  human_readable_progress: "progress.md"
  machine_readable_template: "templates/ai-harness/run-record.template.json"
  update_on:
    - "gate_state_change"
    - "batch_close"
  quality_metrics:
    progress_is_compact_snapshot: true
    run_record_is_aggregation_source: true
    do_not_copy_long_logs: true
    rework_counts_gate_driven_product_corrections_only: true
    e2e_product_and_environment_failures_separate: true
    high_escape_requires_observation_boundary: true
    outcome_status_required_at_batch_close: true

runtime_adapters:
  coordinator_owns:
    - "requirements"
    - "spec_plan"
    - "risk_decision"
    - "review_synthesis"
    - "acceptance"
  child_execution_surfaces:
    - "cli"
    - "codex_exec_json"
    - "bounded_subagents"
    - "ci"
  provider_specific_surfaces_are_adapters: true

evaluation:
  golden_tasks_minimum: 10
  metrics:
    - "completion_rate"
    - "first_pass_review_rate"
    - "review_rework_cycles"
    - "verification_rework_cycles"
    - "e2e_product_rework_cycles"
    - "rebaseline_count"
    - "high_severity_escape_by_observation_boundary"
    - "evidence_completeness"
    - "e2e_pass_rate"
  monthly_review:
    cadence: "monthly"
    default_mode: "read_only"
    aggregation: "deterministic_from_run_record_json"
    aggregator: "tools/ai-harness/aggregate-run-records.mjs"
    timezone_required_for_calendar_window: true
    report_template: "eval/templates/monthly-workflow-review.md"
    rule_actions:
      - "retain"
      - "optimize"
      - "move_to_mechanism"
      - "demote"
      - "remove"
    change_policy: "one_attributable_rule_group_then_delta_eval"
    zero_incidents_alone_justify_removal: false
    protected_boundaries:
      - "safety"
      - "destructive_production"
      - "auth"
      - "irreversible_db"
      - "audit"
