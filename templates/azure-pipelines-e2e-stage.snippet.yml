# ========== Stage 3: E2E_Verify(部署后按提交影响面验证,跨项目模板)==========
# 接到前端 pipeline 的 Build + DeployTest 之后。参 standards/cicd-e2e-in-pipeline-standard.md。
# smoke(index 200)只验静态首页可达;本 stage 跑 @floor + 本次修改/关联模块，CRASH 即阻断。
# 全菜单走查不得混入常规提交 CI，只能由独立手工/周期性专项显式触发。
#
# 前置:仓内有 pipeline-e2e/(拷 templates/pipeline-e2e/ 改 spec 路由 + login)。
# 变量:nodeVersion / IIS_TARGET_HOST(Variable Group)/ targetPort(本 pipeline 已有)。
# 占位替换:
#   <E2E_TARGET>   external: http://$(IIS_TARGET_HOST):$(targetPort)
#                  shared_iis: http://$(IIS_TARGET_HOST):$(targetPort)/<vdir>(配 E2E_ROOT_PATH=/<vdir>/)
#   <E2E_API>      后端 API 根(render-walk 登录用),如 http://$(IIS_TARGET_HOST):<apiPort>

- stage: E2EVerify
  displayName: 'E2E 验证 (floor + changed + related)'
  dependsOn: DeployTest
  condition: succeeded()
  jobs:
    - job: PlaywrightCritical
      displayName: 'Playwright Impact Scoped'
      timeoutInMinutes: 60
      steps:
        - checkout: self
          fetchDepth: 2

        - task: NodeTool@0
          displayName: 'Use Node $(nodeVersion)'
          inputs:
            versionSpec: '$(nodeVersion)'

        - powershell: |
            Set-Location "$(Build.SourcesDirectory)/pipeline-e2e"
            npm install --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw "npm install failed $LASTEXITCODE" }
            npx playwright install chromium --with-deps
            if ($LASTEXITCODE -ne 0) { throw "playwright install failed $LASTEXITCODE" }
          displayName: 'Setup Playwright (npm + chromium)'

        - powershell: |
            Set-Location "$(Build.SourcesDirectory)/pipeline-e2e"
            $env:E2E_TARGET = "<E2E_TARGET>"
            $env:E2E_API = "<E2E_API>"
            $env:CI = "true"
            $decision = node tier-decide.mjs --base HEAD~1 --head HEAD 2>&1 | Out-String
            $decisionExit = $LASTEXITCODE
            Write-Host $decision
            if ($decisionExit -ne 0) { throw "E2E 影响范围计算失败 $decisionExit" }
            $moduleGrep = [regex]::Match($decision, 'variable=E2E_GREP\]([^\r\n]*)').Groups[1].Value.Trim()
            $env:E2E_GREP = if ($moduleGrep) { "@floor|$moduleGrep" } else { '@floor' }
            Write-Host "--- E2E target=$env:E2E_TARGET grep='$env:E2E_GREP' ---"
            npx playwright test --reporter=line
            if ($LASTEXITCODE -ne 0) { throw "E2E failed $LASTEXITCODE" }
          displayName: 'Run E2E (floor + changed + related)'

        - task: PublishTestResults@2
          condition: always()
          displayName: 'Publish JUnit Results'
          inputs:
            testResultsFormat: 'JUnit'
            testResultsFiles: 'pipeline-e2e/test-results/junit.xml'
            failTaskOnFailedTests: false

        - task: PublishBuildArtifacts@1
          condition: always()
          displayName: 'Upload E2E artifacts'
          inputs:
            PathtoPublish: '$(Build.SourcesDirectory)/pipeline-e2e/test-results'
            ArtifactName: 'e2e-artifacts-$(Build.BuildId)'
            publishLocation: 'Container'
